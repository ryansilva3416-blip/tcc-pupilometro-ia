name: Testes

on:
  push:
  pull_request:

jobs:
  python:
    name: Análise (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  banco:
    name: Banco de dados (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
      - run: |
          sudo chown -R postgres "$GITHUB_WORKSPACE/supabase"
          sudo -u postgres bash supabase/tests/rodar_testes.sh

  flutter:
    name: App (Flutter analyze + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
